<!doctype html>
<!-- Author: David Matura -->
<!-- The README's composites: panels of screenshots on a card in GitHub's dark colours, each under a caption. The rules
     are desktop.png's, set for a card 880px wide; --scale fits them to a screenshot of another width (its CSS width
     over 830px, the desktop pane's). Edit the captions and images below, and README.md says how to render it. -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --shot: 920px;
    --scale: calc(920 / 830);
    --unit: calc(var(--scale) * 1px);
  }
  html, body { margin: 0; background: transparent; }
  .card {
    box-sizing: border-box;
    width: calc(var(--shot) + 50 * var(--unit) + 2px);
    padding: calc(5 * var(--unit)) calc(25 * var(--unit)) calc(27 * var(--unit));
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: calc(11 * var(--unit));
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
  }
  h2 {
    margin: calc(20 * var(--unit)) 0 calc(11 * var(--unit));
    color: #9198a1;
    font-size: calc(14.7 * var(--unit));
    font-weight: 500;
  }
  .shot { width: var(--shot); border: 1px solid #30363d; border-radius: calc(8 * var(--unit)); overflow: hidden; }
  .shot img { display: block; width: var(--shot); }
  /* A panel cut short fades into the card over its foot, its frame with it. */
  .cut {
    border-bottom: none;
    border-radius: calc(8 * var(--unit)) calc(8 * var(--unit)) 0 0;
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 108 * var(--unit)), transparent);
  }
</style>
</head>
<body>
  <div class="card">
    <h2>The pane, in the editor</h2>
    <div class="shot cut"><img src="pane.png"></div>
    <h2>A button's question, in place of the list</h2>
    <div class="shot"><img src="question.png"></div>
  </div>
</body>
</html>
